apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nugusu20/microservices-infra-gitops.git
    targetRevision: main
    path: helm/voting-app
    helm: {}

  destination:
    server: https://kubernetes.default.svc
    namespace: voting

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
